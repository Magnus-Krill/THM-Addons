[versions]
mod-version = "0.3.0"

# Fabric (https://fabricmc.net/develop)
minecraft = "26.2"
fabric-loader = "0.20.1"
fabric-api = "0.161.0+26.2"

# Loom (https://github.com/FabricMC/fabric-loom)
loom = "1.19.3"

# Meteor (https://github.com/MeteorDevelopment/meteor-client/)
meteor = "26.2-SNAPSHOT"

# Tests
junit = "6.1.3"

[libraries]
# Tests
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }

# Fabric base
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }

# Meteor client
meteor-client = { module = "meteordevelopment:meteor-client", version.ref = "meteor" }

# Baritone
baritone = { module = "meteordevelopment:baritone", version.ref = "meteor" }

# Optional integrations inspected by compatibility tests.
sodium = { module = "maven.modrinth:sodium", version = "mc26.2-0.9.2-fabric" }
xaeros-minimap = { module = "maven.modrinth:xaeros-minimap", version = "fabric-26.2-26.6.2" }
xaeros-world-map = { module = "maven.modrinth:xaeros-world-map", version = "fabric-26.2-1.47.2" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
