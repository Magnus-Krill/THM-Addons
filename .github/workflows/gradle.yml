name: All tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: All tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - name: Install graphics test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools xvfb xauth libgl1-mesa-dri libglx-mesa0
      - name: Run all tests
        run: xvfb-run -a ./gradlew --no-daemon clean test --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/client-startup/
          retention-days: 14
